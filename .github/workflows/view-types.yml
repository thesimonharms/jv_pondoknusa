name: View prop types

on:
  pull_request:
    paths:
      - 'resources/views/**'
      - 'resources/views/**/*.tyr'
      - 'src/**/*.tyr.ts'

jobs:
  view-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npx pondoknusa view:types --check
